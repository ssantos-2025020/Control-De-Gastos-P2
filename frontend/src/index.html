<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Legatus — Control de Gastos</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/Logo sinfondo.png" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="description" content="Legatus — Control de Gastos Personales" />
</head>
<body>
  <app-root>
    <!-- Splash screen while Angular loads -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0a0e1a;gap:16px;font-family:Inter,system-ui,sans-serif">
      <img src="assets/Logo sinfondo.png" alt="Legatus" style="width:80px;height:80px;border-radius:20px;object-fit:contain;box-shadow:0 14px 30px -8px rgba(1,159,252,0.5)" />
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#7fd4ff,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Legatus</div>
      <div style="font-size:11px;color:#64748b;letter-spacing:1px;text-transform:uppercase">Control de Gastos</div>
      <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.08);border-top-color:#019FFC;border-radius:50%;animation:spin .8s linear infinite;margin-top:8px"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </app-root>
</body>
</html>
